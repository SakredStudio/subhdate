# ShubhDate API: entitlements (Play purchases -> signed tokens) and festival/vrat reminders (Web Push via cron).
# $0 infra: Workers free plan + D1 free tier. Deploy: `wrangler deploy` from this folder (docs/WORKER.md).
name = "shubhdate-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "shubhdate"
database_id = "775e542c-d60d-4b38-905d-de84c57a9830"

[triggers]
crons = ["0 */6 * * *"]

[vars]
PACKAGE_NAME = "com.sakredstudio.shubhdate"
ALLOWED_ORIGIN = "https://shubhdate.sakredstudio.ca,https://sakredstudio.github.io"
# Website purchases (Stripe Checkout). A product is offered on the website only when BOTH its price id and its
# display price are filled in here, and the secrets STRIPE_SECRET_KEY (+ STRIPE_WEBHOOK_SECRET) are set with
# `wrangler secret put`. Empty = not for sale on the website. Steps: docs/WEB-CHECKOUT.md.
STRIPE_PRICE_REPORT_SINGLE = ""
STRIPE_PRICE_FAMILY_ANNUAL = ""
STRIPE_PRICE_NAAM_REPORT = ""
PRICE_REPORT_SINGLE = ""
PRICE_FAMILY_ANNUAL = ""
PRICE_NAAM_REPORT = ""

# Secrets (wrangler secret put <NAME>), never in this file:
#   ENTITLEMENT_PRIVATE_KEY_JWK   ES256 private key (JWK JSON) that signs entitlement tokens; its public half goes to app/config.ts
#   VAPID_PRIVATE_KEY             Web Push VAPID private key (base64url); public half goes to app/config.ts
#   VAPID_PUBLIC_KEY              Web Push VAPID public key (base64url)
#   PLAY_SERVICE_ACCOUNT          Google service-account JSON for the Play Developer API (purchases.products.get / subscriptionsv2.get)
#   RTDN_TOKEN                    shared secret in the Pub/Sub push subscription URL (?token=...) so only Google can post to /v1/rtdn
