<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShubhDate — Find Your Perfect Moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #070B18;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 40px;
  }
  .phone-label {
    text-align: center;
    margin-top: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: rgba(212,168,79,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Design tokens ──────────────────────────────────────
const C = {
  bg0: '#0B1020',
  bg1: '#121A2F',
  bg2: '#1A2440',
  gold: '#D4A84F',
  goldLight: '#E6C97A',
  goldDeep: '#D97706',
  purple: '#A8B4FF',
  text: '#F8F3E8',
  textMuted: 'rgba(248,243,232,0.55)',
  textDim: 'rgba(248,243,232,0.3)',
  glass: 'rgba(255,255,255,0.04)',
  glassBorder: 'rgba(212,168,79,0.18)',
  glassBorderHover: 'rgba(212,168,79,0.55)',
};

const serif = "'Cormorant Garamond', serif";
const sans = "'DM Sans', sans-serif";

// ── Utility components ──────────────────────────────────
function StarField({ count = 40 }) {
  const stars = useRef([]);
  if (!stars.current.length) {
    stars.current = Array.from({ length: count }, (_, i) => ({
      x: Math.random() * 100,
      y: Math.random() * 100,
      r: Math.random() * 1.5 + 0.3,
      opacity: Math.random() * 0.6 + 0.15,
      dur: Math.random() * 3 + 2,
      delay: Math.random() * 4,
    }));
  }
  return (
    <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
      {stars.current.map((s, i) => (
        <circle key={i} cx={`${s.x}%`} cy={`${s.y}%`} r={s.r} fill={C.goldLight}>
          <animate attributeName="opacity" values={`${s.opacity};${s.opacity * 0.2};${s.opacity}`}
            dur={`${s.dur}s`} begin={`${s.delay}s`} repeatCount="indefinite" />
        </circle>
      ))}
    </svg>
  );
}

function Mandala({ size = 220, glow = true }) {
  return (
    <svg width={size} height={size} viewBox="0 0 220 220" fill="none" style={{ filter: glow ? `drop-shadow(0 0 24px ${C.gold}88)` : 'none' }}>
      <circle cx="110" cy="110" r="108" stroke={C.gold} strokeWidth="0.5" strokeOpacity="0.3"/>
      <circle cx="110" cy="110" r="90" stroke={C.goldLight} strokeWidth="0.5" strokeOpacity="0.2"/>
      <circle cx="110" cy="110" r="70" stroke={C.gold} strokeWidth="1" strokeOpacity="0.4"/>
      <circle cx="110" cy="110" r="50" stroke={C.goldLight} strokeWidth="0.8" strokeOpacity="0.5"/>
      <circle cx="110" cy="110" r="30" stroke={C.gold} strokeWidth="1" strokeOpacity="0.6"/>
      {[0,30,60,90,120,150,180,210,240,270,300,330].map(a => (
        <g key={a} transform={`rotate(${a} 110 110)`}>
          <line x1="110" y1="20" x2="110" y2="40" stroke={C.gold} strokeWidth="1" strokeOpacity="0.5"/>
          <line x1="110" y1="60" x2="110" y2="80" stroke={C.goldLight} strokeWidth="0.5" strokeOpacity="0.35"/>
          <circle cx="110" cy="42" r="2" fill={C.gold} fillOpacity="0.6"/>
        </g>
      ))}
      {[0,45,90,135,180,225,270,315].map(a => (
        <g key={a} transform={`rotate(${a} 110 110)`}>
          <path d="M110 70 L115 85 L110 100 L105 85 Z" fill={C.gold} fillOpacity="0.25"/>
        </g>
      ))}
      <circle cx="110" cy="110" r="10" fill={C.gold} fillOpacity="0.15"/>
      <circle cx="110" cy="110" r="5" fill={C.goldLight} fillOpacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 110 110" to="360 110 110" dur="60s" repeatCount="indefinite"/>
    </svg>
  );
}

function GoldButton({ children, style, onClick, outlined }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button onClick={onClick}
      onMouseDown={() => setPressed(true)} onMouseUp={() => setPressed(false)} onMouseLeave={() => setPressed(false)}
      style={{
        width: '100%', padding: '14px 0', borderRadius: 14, border: 'none', cursor: 'pointer',
        fontFamily: sans, fontWeight: 600, fontSize: 15, letterSpacing: '0.03em',
        transition: 'all 0.18s',
        transform: pressed ? 'scale(0.97)' : 'scale(1)',
        ...(outlined ? {
          background: 'transparent',
          border: `1.5px solid ${C.gold}`,
          color: C.gold,
        } : {
          background: `linear-gradient(135deg, ${C.goldDeep}, ${C.gold}, ${C.goldLight})`,
          color: '#0B1020',
          boxShadow: pressed ? '0 2px 12px rgba(212,168,79,0.25)' : '0 4px 20px rgba(212,168,79,0.35)',
        }),
        ...style,
      }}>
      {children}
    </button>
  );
}

function GlassCard({ children, style, selected, onClick }) {
  const [hov, setHov] = useState(false);
  return (
    <div onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        background: selected ? 'rgba(212,168,79,0.1)' : C.glass,
        border: `1px solid ${selected ? C.gold : hov ? C.glassBorderHover : C.glassBorder}`,
        borderRadius: 16,
        backdropFilter: 'blur(12px)',
        boxShadow: selected ? `0 0 20px rgba(212,168,79,0.2), inset 0 0 20px rgba(212,168,79,0.08)` : hov ? '0 0 14px rgba(212,168,79,0.12)' : 'none',
        transition: 'all 0.2s',
        cursor: onClick ? 'pointer' : 'default',
        ...style,
      }}>
      {children}
    </div>
  );
}

// ── Bottom Tab Bar ──────────────────────────────────────
function TabBar({ active, onNav }) {
  const tabs = [
    { id: 'home', label: 'Home', icon: <HomeIcon/> },
    { id: 'events', label: 'My Events', icon: <CalIcon/> },
    { id: 'consult', label: 'Consult', icon: <StarIcon/> },
    { id: 'saved', label: 'Saved', icon: <HeartIcon/> },
    { id: 'profile', label: 'Profile', icon: <PersonIcon/> },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, height: 80,
      background: 'rgba(11,16,32,0.95)', backdropFilter: 'blur(20px)',
      borderTop: `1px solid rgba(212,168,79,0.12)`,
      display: 'flex', alignItems: 'center',
      paddingBottom: 16, zIndex: 100,
    }}>
      {tabs.map(t => (
        <button key={t.id} onClick={() => onNav(t.id)} style={{
          flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
          background: 'none', border: 'none', cursor: 'pointer',
          color: active === t.id ? C.gold : C.textDim,
          transition: 'color 0.2s',
        }}>
          <div style={{ fontSize: 20, lineHeight: 1 }}>{t.icon}</div>
          <span style={{ fontSize: 10, fontFamily: sans, fontWeight: active === t.id ? 600 : 400 }}>{t.label}</span>
        </button>
      ))}
    </div>
  );
}

// Tab icons as SVG
function HomeIcon() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>; }
function CalIcon() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>; }
function StarIcon() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>; }
function HeartIcon() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>; }
function PersonIcon() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>; }

// ── Screen 1: Home Dashboard ────────────────────────────
function HomeScreen({ onNav, savedDates, hasQueried }) {
  return (
    <div style={{ position: 'absolute', inset: 0, background: `linear-gradient(160deg, ${C.bg0} 0%, ${C.bg1} 50%, ${C.bg2} 100%)`, overflowY: 'auto', paddingBottom: 80 }}>
      <StarField count={50}/>
      {/* Header */}
      <div style={{ padding: '60px 24px 0', textAlign: 'center', position: 'relative' }}>
        <p style={{ fontFamily: sans, fontSize: 12, letterSpacing: '0.18em', color: C.gold, textTransform: 'uppercase', marginBottom: 8, opacity: 0.8 }}>✦ Vedic Astrology ✦</p>
        <h1 style={{ fontFamily: serif, fontSize: 36, fontWeight: 300, color: C.text, lineHeight: 1.1, marginBottom: 4 }}>ShubhDate</h1>
      </div>
      {/* Mandala */}
      <div style={{ display: 'flex', justifyContent: 'center', margin: '20px 0 16px', position: 'relative' }}>
        <div style={{ position: 'relative', width: 200, height: 200 }}>
          <div style={{ position: 'absolute', inset: -30, background: `radial-gradient(ellipse, rgba(212,168,79,0.12) 0%, transparent 70%)`, borderRadius: '50%' }}/>
          <Mandala size={200}/>
        </div>
      </div>
      {/* Tagline */}
      <div style={{ textAlign: 'center', padding: '0 32px 24px' }}>
        <h2 style={{ fontFamily: serif, fontSize: 26, fontWeight: 400, fontStyle: 'italic', color: C.text, lineHeight: 1.25, marginBottom: 8 }}>Find Your<br/>Perfect Moment</h2>
        <p style={{ fontFamily: sans, fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>Align your most important decisions with the cosmos</p>
      </div>
      {/* CTAs */}
      <div style={{ padding: '0 24px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        <GoldButton onClick={() => onNav('onboarding')}>✨ Get My Auspicious Dates</GoldButton>
        <GoldButton outlined onClick={() => onNav('eventselect')}>Guest Mode</GoldButton>
      </div>
      {/* Upcoming / Empty state */}
      <div style={{ padding: '28px 24px 0' }}>
        {hasQueried && savedDates.length > 0 ? (
          <>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
              <p style={{ fontFamily: serif, fontSize: 18, fontWeight: 500, color: C.text }}>Your Saved Dates</p>
              <span style={{ fontFamily: sans, fontSize: 12, color: C.gold, cursor: 'pointer' }} onClick={() => onNav('saved')}>See all →</span>
            </div>
            {savedDates.slice(0, 2).map((ev, i) => (
              <GlassCard key={i} style={{ padding: '14px 16px', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 14 }} onClick={() => onNav('results')}>
                <div style={{ width: 44, height: 44, borderRadius: 12, background: 'rgba(212,168,79,0.1)', border: `1px solid ${C.glassBorder}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>{ev.icon}</div>
                <div style={{ flex: 1 }}>
                  <p style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 2 }}>{ev.label}</p>
                  <p style={{ fontFamily: sans, fontSize: 11, color: C.textMuted }}>{ev.date} · {ev.time}</p>
                </div>
                <ScoreRing score={ev.score} size={38}/>
              </GlassCard>
            ))}
          </>
        ) : hasQueried ? (
          // Queried but nothing saved yet
          <GlassCard style={{ padding: '24px 20px', textAlign: 'center' }}>
            <p style={{ fontSize: 32, marginBottom: 10 }}>🔖</p>
            <p style={{ fontFamily: serif, fontSize: 17, color: C.text, marginBottom: 6 }}>No saved dates yet</p>
            <p style={{ fontFamily: sans, fontSize: 12, color: C.textMuted, lineHeight: 1.6, marginBottom: 14 }}>Bookmark auspicious dates from your results to see them here.</p>
            <GoldButton onClick={() => onNav('results')} style={{ fontSize: 13, padding: '10px 0' }}>View My Last Results</GoldButton>
          </GlassCard>
        ) : (
          // Brand new user — no queries yet
          <GlassCard style={{ padding: '24px 20px', textAlign: 'center' }}>
            <p style={{ fontSize: 32, marginBottom: 10 }}>🌙</p>
            <p style={{ fontFamily: serif, fontSize: 17, color: C.text, marginBottom: 6 }}>Your journey begins here</p>
            <p style={{ fontFamily: sans, fontSize: 12, color: C.textMuted, lineHeight: 1.6, marginBottom: 14 }}>
              Run your first query to discover auspicious dates tailored to your birth chart. They'll appear right here.
            </p>
            <GoldButton onClick={() => onNav('onboarding')} style={{ fontSize: 13, padding: '10px 0' }}>Find My First Date ✨</GoldButton>
          </GlassCard>
        )}
      </div>
    </div>
  );
}

// ── Score Ring ──────────────────────────────────────────
function ScoreRing({ score, size = 60 }) {
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(212,168,79,0.15)" strokeWidth="3"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.gold} strokeWidth="3"
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"/>
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <span style={{ fontFamily: sans, fontSize: size > 50 ? 16 : 11, fontWeight: 700, color: C.gold }}>{score}</span>
      </div>
    </div>
  );
}

// ── Screen 2: Onboarding ────────────────────────────────
function OnboardingScreen({ onNav }) {
  const [name, setName] = useState('');
  const [dob, setDob] = useState('');
  const [tob, setTob] = useState('');
  const [city, setCity] = useState('');
  const inputStyle = {
    width: '100%', padding: '13px 16px', borderRadius: 12,

  return (
    <div style={{ position: 'absolute', inset: 0, background: `linear-gradient(160deg, ${C.bg0} 0%, ${C.bg1} 100%)`, overflowY: 'auto', paddingBottom: 100 }}>
      <StarField count={35}/>
      {/* Progress */}
      <div style={{ padding: '56px 24px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
          {[1,2,3].map(n => (
            <div key={n} style={{ flex: 1, height: 3, borderRadius: 2, background: n <= 2 ? `linear-gradient(90deg, ${C.goldDeep}, ${C.gold})` : 'rgba(255,255,255,0.1)' }}/>
          ))}
        </div>

      </div>
      {/* Heading */}
      <div style={{ padding: '18px 24px 24px' }}>
        <h2 style={{ fontFamily: serif, fontSize: 30, fontWeight: 400, color: C.text, lineHeight: 1.2, marginBottom: 8 }}>Your Cosmic<br/>Identity</h2>
        <p style={{ fontFamily: sans, fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>Your birth details allow us to calculate your personal planetary positions with precision.</p>
      </div>
      {/* Form */}
      <div style={{ padding: '0 24px' }}>
        <label style={{ fontFamily: sans, fontSize: 11, color: C.gold, letterSpacing: '0.1em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Full Name</label>
        <input style={inputStyle} placeholder="e.g. Priya Sharma" value={name} onChange={e => setName(e.target.value)}/>

        <input type="date" style={{ ...inputStyle, colorScheme: 'dark' }} value={dob} onChange={e => setDob(e.target.value)}/>

          <span style={{ fontSize: 16, flexShrink: 0, marginTop: 2 }}>🔒</span>
          <p style={{ fontFamily: sans, fontSize: 12, color: C.textMuted, lineHeight: 1.5 }}>Your birth data is used only for astrological calculations and is never shared with third parties.</p>

      {/* CTA */}

        <GoldButton onClick={() => onNav('eventselect')}>Continue →</GoldButton>
      </div>

// ── Screen 4: Results ────────────────────────────────────
function ResultsScreen({ onNav, onSave, savedDates, onQueried }) {
  const [showPaywall, setShowPaywall] = useState(false);
  const results = [

            { key: 'consult', label: 'Astrologer Replies', desc: 'When an expert responds to you' }].map(n => (
            <div key={n.key} style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18 }}>
              <div style={{ flex: 1 }}>
                <p style={{ fontFamily: sans, fontSize: 14, color: C.text, marginBottom: 2 }}>{n.label}</p>
                <p style={{ fontFamily: sans, fontSize: 12, color: C.textMuted }}>{n.desc}</p>

                <div style={{ position: 'absolute', top: 3, left: notifs[n.key] ? 22 : 3, width: 18, height: 18, borderRadius: '50%', background: '#fff', transition: 'left 0.2s' }}/>
              </div>
            </div>
          ))}
          <GoldButton onClick={() => setModal(null)} style={{ marginTop: 8 }}>Done</GoldButton>
        </ModalSheet>
      )}

      {/* Subscription Modal */}
      {modal === 'sub' && (
        <ModalSheet title="Your Subscription" onClose={() => setModal(null)}>
          <GlassCard style={{ padding: '16px', marginBottom: 16, textAlign: 'center' }}>
            <p style={{ fontFamily: sans, fontSize: 11, color: C.gold, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 6 }}>Current Plan</p>
            <p style={{ fontFamily: serif, fontSize: 26, color: C.goldLight, marginBottom: 4 }}>Premium</p>
            <p style={{ fontFamily: sans, fontSize: 13, color: C.textMuted }}>₹49/month · Renews May 27, 2026</p>
          </GlassCard>
          <GoldButton outlined onClick={() => setModal(null)} style={{ marginBottom: 10 }}>Cancel Subscription</GoldButton>
          <GoldButton onClick={() => setModal(null)}>Upgrade to Lifetime — ₹399</GoldButton>
        </ModalSheet>
      )}

      {/* Privacy Modal */}
      {modal === 'privacy' && (
        <ModalSheet title="Privacy & Data" onClose={() => setModal(null)}>
          <p style={{ fontFamily: sans, fontSize: 13, color: C.textMuted, lineHeight: 1.7, marginBottom: 20 }}>Your birth data and queries are stored securely and used only for astrological calculations. We never share or sell your personal information to third parties.</p>
          <GoldButton outlined style={{ marginBottom: 10 }} onClick={() => setModal(null)}>Download My Data</GoldButton>
          <GoldButton outlined style={{ marginBottom: 10 }} onClick={() => setModal(null)}>Delete Account</GoldButton>
          <GoldButton onClick={() => setModal(null)}>Close</GoldButton>
        </ModalSheet>
      )}

      {/* Rate Modal */}
      {modal === 'rate' && (
        <ModalSheet title="Rate ShubhDate" onClose={() => setModal(null)}>
          <p style={{ fontFamily: sans, fontSize: 13, color: C.textMuted, marginBottom: 20, lineHeight: 1.6 }}>Enjoying ShubhDate? Your review helps other families find auspicious moments for their special days.</p>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 12, marginBottom: 24, fontSize: 32 }}>
            {[1,2,3,4,5].map(s => <span key={s} style={{ cursor: 'pointer', filter: 'drop-shadow(0 0 6px rgba(212,168,79,0.5))' }}>⭐</span>)}
          </div>
          <GoldButton onClick={() => setModal(null)}>Submit Rating</GoldButton>
        </ModalSheet>
      )}

      {modal === 'panchang' && (
        <ModalSheet title="Daily Panchang Alerts" onClose={() => setModal(null)}>
          <p style={{ fontFamily: sans, fontSize: 13, color: C.textMuted, marginBottom: 20, lineHeight: 1.6 }}>Receive a morning summary of today's Tithi, Nakshatra, Yoga, Karana and auspicious hours — every day at 6:00 AM.</p>
          <GoldButton onClick={() => { setNotifs(n => ({ ...n, daily: true })); setModal(null); }}>Enable Panchang Alerts</GoldButton>
        </ModalSheet>
      )}
    </div>
  );
}

// ── App Shell ────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('welcome');
  const [tab, setTab] = useState('home');
  const [savedDates, setSavedDates] = useState([]);
  const [hasQueried, setHasQueried] = useState(false);
  const [language, setLanguage] = useState('en');

  function navigate(to) {
    const tabMap = { home: 'home', onboarding: 'home', eventselect: 'events', results: 'home', consult: 'consult', saved: 'saved', profile: 'profile', myevents: 'events' };
    setScreen(to);
    if (tabMap[to]) setTab(tabMap[to]);
  }

  function handleTab(id) {
    setTab(id);
    const tabScreenMap = { home: 'home', events: 'myevents', consult: 'consult', saved: 'saved', profile: 'profile' };
    setScreen(tabScreenMap[id] || 'home');
  }

  function handleSave(date) {
    setSavedDates(prev => prev.some(d => d.shortDate === date.shortDate) ? prev : [...prev, date]);
  }

  const isWelcome = screen === 'welcome';

  const screenMap = {
    welcome: <LanguageWelcomeScreen onNext={(dest) => { setScreen(dest); setTab('home'); }} language={language} onLanguageChange={setLanguage}/>,
    home: <HomeScreen onNav={navigate} savedDates={savedDates} hasQueried={hasQueried}/>,
    onboarding: <OnboardingScreen onNav={navigate}/>,
    eventselect: <EventSelectScreen onNav={navigate}/>,
    results: <ResultsScreen onNav={navigate} onSave={handleSave} savedDates={savedDates} onQueried={() => setHasQueried(true)}/>,
    consult: <ConsultScreen/>,
    saved: <SavedScreen onNav={navigate} savedDates={savedDates}/>,
    profile: <ProfileScreen onNav={navigate} language={language} onLanguageChange={setLanguage}/>,
    myevents: <MyEventsScreen onNav={navigate}/>,
  };

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
      {screenMap[screen] || screenMap.home}
      {!isWelcome && <TabBar active={tab} onNav={handleTab}/>}
    </div>
  );
}

// ── Mount inside iOS Frame ───────────────────────────────
function Root() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', background: '#070B18' }}>
      <div>
        <IOSDevice dark={true} width={390} height={844}>
          <App/>
        </IOSDevice>
        <p style={{ textAlign: 'center', marginTop: 16, fontFamily: sans, fontSize: 12, color: 'rgba(212,168,79,0.4)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>ShubhDate · Premium Prototype</p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root/>);
